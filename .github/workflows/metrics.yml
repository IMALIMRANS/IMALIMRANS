name: GitHub Profile Dashboard

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  github-profile-dashboard:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ─────────────────────────────────────
      # 1. GitHub Metrics Dashboard
      # ─────────────────────────────────────
      - name: Generate GitHub Metrics Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: IMALIMRANS

          template: classic
          base: header, activity, community, repositories, metadata

          config_timezone: Asia/Dhaka
          config_display: large
          config_animations: yes

          filename: github-metrics.svg

          output_action: commit
          committer_branch: main
          committer_message: "chore: update GitHub metrics [Skip GitHub Action]"


      # ─────────────────────────────────────
      # 2. GitHub Contribution Calendar
      # ─────────────────────────────────────
      - name: Generate GitHub Contribution Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: IMALIMRANS

          template: classic
          base: ""

          plugin_calendar: yes
          plugin_calendar_limit: 1

          config_timezone: Asia/Dhaka
          config_display: large
          config_animations: yes

          filename: github-metrics-calendar.svg

          output_action: commit
          committer_branch: main
          committer_message: "chore: update GitHub contribution calendar [Skip GitHub Action]"


      # ─────────────────────────────────────
      # 3. GitHub Profile Trophy
      # ─────────────────────────────────────
      - name: Generate GitHub Trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: IMALIMRANS
          output_path: github-trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
