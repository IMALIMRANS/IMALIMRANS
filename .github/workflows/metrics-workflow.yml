name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # প্রতিদিন রাত ১২টায় (UTC) নিজে থেকে আপডেট হবে
  workflow_dispatch:        # চাইলে Actions ট্যাব থেকে ম্যানুয়ালি "Run workflow" চেপে সাথে সাথেও চালানো যাবে

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1) Stats + Top Languages card → replaces "GitHub Dashboard" stats/languages
      - name: Stats & languages card
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: IMALIMRANS
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          config_timezone: Asia/Dhaka

      # 2) Achievements card → replaces the broken "GitHub Trophies" image
      - name: Achievements card
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: IMALIMRANS
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          config_timezone: Asia/Dhaka

      # 3) Isometric contribution calendar → replaces the broken "Contribution Activity" graph
      - name: Contribution calendar card
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-calendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: IMALIMRANS
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Dhaka
